apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 41.7.1
    releaseName: traefik
    namespace: traefik
    includeCRDs: true
    valuesInline:
      providers:
        kubernetesCRD:
          enabled: true
          allowExternalNameServices: true
          allowCrossNamespace: true 
        kubernetesIngress:
          enabled: true
          allowExternalNameServices: true
          allowCrossNamespace: true
      service:
        externalTrafficPolicy: Cluster
        annotations:
          metallb.universe.tf/loadBalancerIPs: "10.1.130.2"
      deployment:
        hostNetwork: false

resources:
  - config/certificate.yaml
  - config/traefik-dashboard-ingress.yaml
  - config/redirect-middleware.yaml
