apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 41.7.1
    releaseName: traefik
    namespace: traefik
    includeCRDs: true
    valuesFiles:
      - config/values.yaml

resources:
  - config/certificate.yaml
  - config/traefik-dashboard-ingress.yaml
  - config/redirect-middleware.yaml
