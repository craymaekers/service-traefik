apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 41.7.1
    releaseName: traefik
    namespace: traefik
    includeCRDs: true
    valuesInline:
      service:
        externalTrafficPolicy: Local
        annotations:
          metallb.universe.tf/loadBalancerIPs: "10.1.130.2"
        deployment:
          hostNetwork: false

resources:
  - config/traefik-dashboard-ingress.yaml
  - config/redirect-middleware.yaml
